name: 03 - Frontend Pipeline

on:
  workflow_run:
    workflows: ["02 - Backend Pipeline"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**']

jobs:
  build-and-deploy-frontend:
    name: Build Frontend & Deploy to Nginx
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Compile Static Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy Dist Artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*,frontend/build/*"
          target: "/tmp/frontend_artifacts/"
          strip_components: 2

      - name: Atomically Replace Web Root & Reload Nginx
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /tmp/frontend_artifacts/* /usr/share/nginx/html/
            sudo rm -rf /tmp/frontend_artifacts
            sudo chown -R appuser:appuser /usr/share/nginx/html
            sudo systemctl reload nginx